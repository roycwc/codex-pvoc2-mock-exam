<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b39">
  <meta name="description" content="香港二級船牌甲乙部 360 題：航駛、船藝、安全及輪機知識，附答案、解釋、官方出處，以及各40題45分鐘分卷模擬試。">
  <title>大偈研習室 · 香港船牌甲乙部操題</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">跳到題目</a>
  <header class="header">
    <a class="brand" href="#practice" aria-label="大偈研習室首頁"><span class="brand-mark" aria-hidden="true">船</span><span>大偈研習室<small>HK PVOC 2 · PART A + B</small></span></a>
    <button class="share-btn" id="share" type="button">分享操題 ↗</button>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <p class="eyebrow">二級遊樂船操作人</p>
      <nav aria-label="主要功能" id="nav">
        <button data-view="practice" class="nav-item active"><span aria-hidden="true">▤</span>日常操題</button>
        <button data-view="exam" class="nav-item"><span aria-hidden="true">◷</span>模擬考試</button>
        <button data-view="mistakes" class="nav-item"><span aria-hidden="true">↻</span>錯題重溫 <b id="wrong-count">0</b></button>
        <button data-view="sources" class="nav-item"><span aria-hidden="true">↗</span>題庫與出處</button>
      </nav>
      <div class="side-note"><span class="eyebrow">本機學習進度</span><strong id="seen-count">0 題</strong><div class="mini-progress"><span id="seen-bar"></span></div><p id="seen-label">由第一題開始</p><small>記錄只保留喺呢個瀏覽器。</small></div>
      <p class="side-footer">航海・船藝・輪機 · 繁體中文<br>獨立研習網站</p>
    </aside>
    <main id="main" tabindex="-1"><div class="initial"><p class="eyebrow">PART A + B / PVOC 2</p><h1>航海到輪機，逐題練穩。</h1><p>正在載入題庫…</p></div></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><h2 id="dialog-title">確認交卷？</h2><p id="dialog-message"></p><div class="dialog-actions"><button value="cancel" class="secondary">繼續作答</button><button value="confirm" class="primary">確認</button></div></form></dialog>
  <noscript><p>請開啟 JavaScript 使用互動操題功能。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
